apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Next.js Commerce storefront runs on Cloudflare Workers + Static Assets with R2 and Durable Objects as its Next.js cache, a per-environment rendered wrangler config and green checks
  affects:
    - apps/web
    - tests/web
    - tooling/wire
    - pnpm-lock.yaml
    - package.json
    - turbo.json
    - .gitignore
  doneWhen:
    - pnpm wire:fixture, typecheck, lint, test and build are green in Checks
    - wrangler dev serves /, the static assets and /opengraph-image, and /api/revalidate answers 401 without the secret and revalidates with it
  gates:
    - checks
