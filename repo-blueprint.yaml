apiVersion: orun.dev/v1
kind: Blueprint
metadata:
  name: commerce
  description: >-
    The commerce storefront as a Blueprint of itself — instantiate a new
    headless-storefront repository (Next.js on Cloudflare Workers + Static
    Assets, R2 and Durable Objects as the Next.js cache, the bucket
    Terraform provisions per environment, a bundled demo catalogue until the
    owner connects a Shopify store) and take it from nothing to live on stage
    and prod: ONE landing that places, brands and merges the whole product,
    one convergence that applies the bucket before the Worker that binds it,
    then a hook-only phase that records what went live. Run one at a time with
    `--phase <name>` or the whole sequence with `--resume`; see
    docs/phases/README.md for the contract every phase follows, and
    BOOTSTRAP.md for the operator checklist no script can perform.

# ── INPUTS ────────────────────────────────────────────────────────────────
# The instance-identity contract, consumed by tooling/rebrand/rebrand.mjs via
# the `.rebrand/values.json` the `rebrand-values` module templates. Every
# input a later phase needs is in that file, because it is committed and so
# survives a fresh container; `.orun/provenance.lock` does not.
#
# The card (blueprint.yaml) declares a subset of these with the patterns the
# console validates; testing/manifest.test.sh fails if a card input is not
# one of these, or if one of these is required and nothing supplies it.
inputs:
  reponame:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    required: true
    description: Repo slug (e.g. acme-shop) — intent metadata.name, the Worker name prefix, the R2 bucket names, the secret project.
  productname:
    type: string
    required: true
    description: The store's display name (e.g. "Acme Shop") — the navbar, the footer, every page title and the Open Graph image.
  productdomain:
    type: string
    default: ""
    description: >-
      The store's own domain, once it has one (e.g. shop.acme.dev). NOT ASKED:
      the store answers on workers.dev from its first deploy and builds its
      absolute links from the request it is answering, and a domain is an
      owner's step after it. Empty, the rebrand writes the reserved
      placeholder `<reponame>.example.com` where the domain goes (BASE_DOMAIN
      in intent.yaml, for every environment), so setting it later is
      replacing that one string — the store's README, "Custom domain", says
      how. Pass it with --set only to brand a hand-run build with a domain it
      already has.
  githuborg:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    required: true
    description: >-
      GitHub owner the store's repository is created under — and the owner in
      the source link the footer carries. 01-product waits for the App
      installation on THIS owner before it creates anything: the platform
      learns of a pull request only through the installation on the account
      that owns the repository.
  subdomain:
    type: string
    default: "your-workers-subdomain"
    description: >-
      The workers.dev subdomain of the Cloudflare account the site deploys
      into — its URLs and the probes. A console or `--from bst_…` build gets
      it from the workspace's Cloudflare connection (blueprint.yaml declares
      `from: connection.cloudflare.workersSubdomain`); pass it with --set
      only for a hand-run build.
  repoPrivate:
    type: boolean
    default: true
    description: >-
      Whether the repository is created private. Private is the safe default;
      `orun.repo/ensure@v1` only sets it at creation — an existing repository
      keeps the visibility it has.
  orunWorkspace:
    type: string
    default: ""
    # Unset, it is the workspace the build runs in (ORUN_WORKSPACE — which a
    # console build's sandbox always sets, and which the console form cannot
    # send). A value set on the command line or recorded by the tree wins.
    from: workspace
    description: >-
      Orun Cloud workspace (ws_…) for the site's remote state and secrets.
      Unset, it is the workspace the build runs in; with none anywhere,
      01-product writes a placeholder that fails loudly rather than silently
      claiming another tenant's workspace.
  epicSlug:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    default: commerce-baselining
    description: >-
      The epic this bootstrap tracks itself under. Found by slug, so a run
      that starts fresh and a run that resumes find the same work.

# ── SOURCES ───────────────────────────────────────────────────────────────
# The baseline is this repository itself. Run `orun new` from its root so
# `path: .` resolves to it; orun pins it by digest into its object store
# before any module reads it, so an instance is reproducible and provenanced.
sources:
  - name: baseline
    kind: dir
    path: .

# Derived build output, local secrets, and the factory's own lanes — never
# carried into an instance.
#
# WHAT `ignore` ACTUALLY EXCLUDES: orun matches an entry two ways, and which
# one depends on the entry. A pattern with no glob metacharacter is compared
# against each path SEGMENT; only a pattern containing one is compared against
# the whole relative path. So `apps/web/.env.local` on its own would match
# nothing — it needs the `**/`. testing/coverage.test.sh refuses an entry that
# names a path without a glob.
ignore:
  - dist
  - coverage
  - .turbo
  - .next
  - .open-next
  - .wrangler
  - .terraform
  - node_modules
  - .orun
  - plan.json
  - "**/*.tsbuildinfo"
  - "**/next-env.d.ts"
  - "**/*.tfstate"
  - "**/*.tfstate.backup"
  - "**/.terraform.lock.hcl"
  # `orun new` snapshots the WORKING TREE, not the git index: an operator's
  # local environment files would otherwise be copied into somebody else's
  # repository. `.env.example` is not among them, and ships.
  - "**/.env"
  - "**/.env.local"
  - "**/.env.*.local"
  - "**/.dev.vars"
  - "**/.dev.vars.*"
  # THE FACTORY'S OWN LANES. `github-workflows` copies the whole of `.github`,
  # so without these two entries every site built from this baseline would
  # carry them — `baseline.yml` runs `testing/*.sh`, which no module places,
  # and `tag.yml` cuts baseline tags a site does not have.
  # testing/coverage.test.sh fails if a lane reading `testing/` is not here.
  - "**/.github/workflows/baseline.yml"
  - "**/.github/workflows/tag.yml"

# ── MODULES ───────────────────────────────────────────────────────────────
# One module per component or root file. Root files are single-file modules
# rather than one module with an include list: a file shipping to a product
# is a line in a diff, and nothing of the factory (specs/, tasks/, testing/,
# hooks/, docs/phases/, tooling/rebrand/, tooling/bootstrap/, the blueprints,
# BOOTSTRAP.md) can ship by accident. testing/leak.test.sh holds that line.
modules:
  # ── the identity file every later phase reads back ───────────────────────
  # The only place blueprint inputs touch the tree; everything else is a
  # verbatim copy the `rebrand` hook rewrites. Committed, so a phase run months
  # later from a fresh container recovers what the operator answered.
  - name: rebrand-values
    mode: template
    files:
      ".rebrand/values.json": |
        {
          "reponame": "{{ .reponame }}",
          "productname": "{{ .productname }}",
          "productdomain": "{{ .productdomain }}",
          "subdomain": "{{ .subdomain }}",
          "orunWorkspace": "{{ .orunWorkspace }}",
          "githuborg": "{{ .githuborg }}",
          "epicSlug": "{{ .epicSlug }}"
        }

  # ── root files ───────────────────────────────────────────────────────────
  - name: root-intent
    mode: copy
    source: baseline
    from: intent.yaml
    to: intent.yaml
  - name: root-package-json
    mode: copy
    source: baseline
    from: package.json
    to: package.json
  - name: root-pnpm-workspace
    mode: copy
    source: baseline
    from: pnpm-workspace.yaml
    to: pnpm-workspace.yaml
  # The baseline's complete lockfile, as it is: the whole tree lands at once
  # and the lockfile carries no identity, so there is nothing to re-resolve —
  # the lanes install it with --frozen-lockfile, and the baseline's own CI
  # (testing/e2e.test.sh) does the same on this exact tree before a tag.
  - name: root-pnpm-lock
    mode: copy
    source: baseline
    from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - name: root-turbo
    mode: copy
    source: baseline
    from: turbo.json
    to: turbo.json
  - name: root-gitignore
    mode: copy
    source: baseline
    from: .gitignore
    to: .gitignore
  # The SITE's README, not this repository's: this one is about the baseline
  # (how to instantiate it, how it is tested), and a site's owner has no use
  # for any of that.
  - name: root-readme
    mode: copy
    source: baseline
    from: .baseline/product/README.md
    to: README.md
  - name: github-workflows
    mode: copy
    source: baseline
    from: .github
    to: .github
  - name: vscode
    mode: copy
    source: baseline
    from: .vscode
    to: .vscode

  # The two context pages a site genuinely owns: its operating contract, and
  # the deployment manifest 02-docs renders. One module per file, so a new
  # file in ai/context/ cannot ship without somebody writing a module for it.
  - name: ai-operations
    mode: copy
    source: baseline
    from: ai/context/operations.md
    to: ai/context/operations.md
  - name: ai-deployment
    mode: copy
    source: baseline
    from: ai/context/deployment.md
    to: ai/context/deployment.md

  # ── the discovery roots, declared ────────────────────────────────────────
  # orun's repo-scale gate — and later `orun plan` in the site's own CI —
  # discovers apps/, infra/, packages/ and tests/, and a missing root is a
  # hard failure. `packages/` has no component in this product, so it exists
  # only through this file. A file the tree needs in order to be valid is
  # what a module is for.
  - name: discovery-roots
    mode: template
    files:
      "apps/.gitkeep": ""
      "infra/.gitkeep": ""
      "packages/.gitkeep": ""
      "tests/.gitkeep": ""

  # ── shared tooling ───────────────────────────────────────────────────────
  # Only what a SITE runs: the TypeScript and ESLint configuration and the
  # wrangler renderer its build calls. The factory's tooling (rebrand,
  # bootstrap) stays here.
  - name: tooling-tsconfig
    mode: copy
    source: baseline
    from: tooling/tsconfig
    to: tooling/tsconfig
  - name: tooling-eslint
    mode: copy
    source: baseline
    from: tooling/eslint
    to: tooling/eslint
  - name: tooling-wire
    mode: copy
    source: baseline
    from: tooling/wire
    to: tooling/wire

  # ── the data plane ───────────────────────────────────────────────────────
  # INFRA BEFORE APP, twice over: placed before the app that binds it (this
  # DAG), and applied before it on every merge to main (apps/web's enforced
  # `dependsOn: cloudflare-r2` in the convergence's plan).
  - name: cloudflare-r2
    mode: copy
    source: baseline
    from: infra/terraform/cloudflare-r2
    to: infra/terraform/cloudflare-r2

  # ── the storefront ───────────────────────────────────────────────────────
  - name: web
    mode: copy
    source: baseline
    from: apps/web
    to: apps/web
    dependsOn: [cloudflare-r2, tooling-eslint, tooling-tsconfig, tooling-wire]
  - name: web-tests
    mode: copy
    source: baseline
    from: tests/web
    to: tests/web
    dependsOn: [web, tooling-eslint, tooling-tsconfig]

# ── THE WORK, UP FRONT ────────────────────────────────────────────────────
# The bootstrap is work, so it lives where work lives — and all of it is on
# the plane before the first phase places a file: one epic, one milestone per
# phase in the order the phases run, one task per landing.
#
# `hooks.preInstantiate` (orun >= v2.60) runs under no phase, once per run, on
# a resume too. Everything here is find-or-create BY IDENTITY — the epic by
# slug, a milestone by name within its epic, a task by title within its epic —
# so a second run, a resume and a redo all find what the first run made. The
# milestones are created IN ORDER and BEFORE the tasks: the plane appends each
# new milestone after the last, and a task naming a milestone the epic does
# not have yet would create it out of order.
#
# IN THE BACKGROUND (orun >= v2.88.0, `background: true` on every hook here).
# Nothing a phase does before its landing reads the task plane — the provider
# check, the placement, the rebrand, the repository, the secrets — so the
# whole list runs beside 01-product instead of before it, in order. A hook
# that works on the plane (`orun.task/ensure@v1`, `orun.pr/land@v1`) waits
# for it to finish; a failure here stops the build at the next hook.
#
# Each phase's own `task` hook runs `orun.task/ensure@v1` on its task again,
# just before its landing. Same identity, so it finds rather than creates,
# and it is how the phase gets the task's KEY for its landing; it sits in
# `post` rather than `pre` so that everything before it overlaps with this
# list. The MILESTONE keeps the phase's name: it is the identity the engine's
# phase events, the plane's evidence and the console's rows all meet on, and
# the card's `programme.milestones` names the same list.
hooks:
  preInstantiate:
    - id: epic
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: epic
        slug: "{{ .inputs.epicSlug }}"
        name: "Storefront baselining — {{ .inputs.productname }}"
        description: >-
          Everything the commerce baseline builds for
          {{ .inputs.productname }} in {{ .inputs.githuborg }}/{{ .inputs.reponame }}:
          the repository, its CI, its R2 cache buckets and the storefront live
          on stage and prod in one landing, then the record of what went live. One
          milestone per phase, in the order the phases run; one task per
          landing, each bound to the pull request that lands it.
        owner: me
    - id: m01
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 01-product
        exitCriteria:
          - repository created under {{ .inputs.githuborg }}, linked to the workspace, the product merged as one pull request
          - the R2 buckets applied and their wiring published on stage and prod
          - the storefront built, deployed and answering on stage and prod
    - id: m02
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: milestone
        epic: "{{ .inputs.epicSlug }}"
        name: 02-docs
        exitCriteria:
          - ai/context/deployment.md on main matches the probed live URLs
          - prod waits on stage again
    - id: t01
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 01-product
        name: "Build the product in one landing"
        brief: >-
          Create {{ .inputs.githuborg }}/{{ .inputs.reponame }} and land the
          whole product as its first pull request — intent, CI, tooling, the
          R2 root, the storefront and its tests, branded as {{ .inputs.productname }}
          — then see one convergence apply the buckets and deploy the
          storefront to stage and prod, smoke-tested over HTTP.
        prefix: BASE
        contract: .baseline/tasks/01-product.TaskContract.yaml
    - id: t02
      uses: orun.task/ensure@v1
      background: true
      with:
        kind: task
        epic: "{{ .inputs.epicSlug }}"
        milestone: 02-docs
        name: "Record the live deployment"
        brief: >-
          Probe every live URL one last time and write the deployment record
          into the repository from what actually answered, not from what the
          blueprint intended.
        prefix: BASE
        contract: .baseline/tasks/02-docs.TaskContract.yaml

# ── PHASES ────────────────────────────────────────────────────────────────
# A phase is orun's own barrier over the module DAG and the whole of what a
# phase DOES: what it is for a person (`title`), what to budget
# (`expectedMinutes`), what must already be true (`requires`), and the hooks
# that do its work around placement — `pre` before, `post` after, `await` for
# what is still converging when the hooks are done.
#
# THE ORDER HERE IS THE EXECUTION ORDER, and the numbered names are the names
# the task plane's milestones carry. A dependency may never point forward
# across a phase boundary; orun refuses the blueprint if one does.
#
# TWO PHASES. `01-product` places, brands and lands EVERYTHING as one pull
# request, and the convergence that merge triggers deploys it in dependency
# order — the R2 bucket before the Worker that binds it, because apps/web
# depends on cloudflare-r2 with `mode: enforced` on a push to main. Nothing
# about that order needs a landing of its own; the plan carries it.
# `02-docs` places NO modules: it is hooks only, a separately landable unit
# with its own task and its own PR.
phases:
  - name: 01-product
    title: The product, built in one landing
    description: The whole tree — manifests, CI, tooling, the R2 root, the storefront and its tests — branded, landed as one pull request, and deployed by one convergence.
    # An estimate, not a measurement — no bootstrap of this baseline has been
    # timed on this shape: the landing checked here (no runner's Checks or
    # `plan` waited for) and merged, then the merge's convergence — the R2
    # apply, then the storefront's build (a larger Next.js app than a
    # starter's), deploy and smoke, stage and prod side by side. A minute
    # under the last estimate, for the task set-up in the background, the
    # landing checked in the box and the watch reading every 5 s.
    expectedMinutes: 13
    narrate:
      start:  "Creating the repository and landing the whole product in one pull request — intent, CI, tooling, the R2 cache bucket and the storefront with its tests. Then one convergence applies the bucket and deploys the storefront on stage and prod. Usually about {{ .meta.expectedMinutes }} minutes."
      await:  "One convergence is deploying the product: the R2 bucket first, then the storefront built with its name, on stage and prod side by side. The Next.js build is the long pole; nothing is stuck."
      done:   "{{ .inputs.reponame }} is live on stage and prod — {{ .meta.files }} files on main, branded as {{ .inputs.productname }}, the storefront answering with its demo catalogue until a Shopify store is connected. That took {{ .meta.elapsed }}."
      failed: "The product did not come up. The failing lane above names the component — the R2 apply, or the storefront's build, deploy or smoke — and a provider error is in its log; whatever deployed is still there."
    modules: [ai-deployment, ai-operations, cloudflare-r2, discovery-roots, github-workflows, rebrand-values, root-gitignore, root-intent, root-package-json, root-pnpm-lock, root-pnpm-workspace, root-readme, root-turbo, tooling-eslint, tooling-tsconfig, tooling-wire, vscode, web, web-tests]
    # THE PLATFORM MUST BE ABLE TO SEE THE REPOSITORY BEFORE IT EXISTS. Every
    # phase lands a pull request that files under its task, and the platform
    # learns of a PR only through the GitHub App installation on the account
    # that OWNS the repository. So the owner's connection is asked for here,
    # before a repository is created, and waited for like any other consent.
    # And the Cloudflare connection, which every deploy credential below is
    # minted from — asked for here too, since this phase is the one that
    # deploys.
    requires:
      probe:
        - id: providers
          uses: orun.doctor/check@v1
          with:
            providers: [github, cloudflare]
            githubOwner: "{{ .inputs.githuborg }}"
            waitSeconds: 600
            pollSeconds: 20
    hooks:
      # The whole tree is placed when these run. rebrand.mjs enumerates it
      # with `git ls-files`, so the output has to be a git repository with a
      # populated index BEFORE it runs. `git add -A` only stages; the landing
      # commits.
      post:
        # A RE-RUN MUST HAVE SOMETHING TO LAND. A convergence can fail AFTER
        # its PR merged, and the merge has already put every file this phase
        # places on main; orun derives phase state from the tree, so a forced
        # re-run lands an EMPTY diff while the site's CI plans `--changed`. So
        # the phase rewrites ONE trailing marker line in each component.yaml
        # its contract names — `# orun: redeploy <phase> <stamp>` — and the
        # landing has a diff that re-plans exactly those components. The
        # marker is a deploy trigger, not state: nothing reads it back.
        - id: retouch
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/retouch.mjs", "--phase", "{{ .phase.name }}", "--affects", "{{ .baseline.dir }}/.baseline/tasks/01-product.TaskContract.yaml"]
        - id: git-init
          run: ["git", "init", "-q"]
        - id: stage
          run: ["git", "add", "-A"]
        - id: rebrand
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--values", ".rebrand/values.json", "--allow-dirty"]
        # Re-tenant the site. rebrand.mjs treats the orun state backend as
        # org-owned and leaves it alone, so intent.yaml would keep THIS
        # repository's `workspace:` — the site's CI would then claim another
        # tenant's workspace on every remote op. Hook argv is not templated,
        # so the value travels through .rebrand/values.json, which IS.
        - id: orun-workspace
          run:
            - node
            - -e
            - |
              const fs = require("fs");
              const values = JSON.parse(fs.readFileSync(".rebrand/values.json", "utf8"));
              const ws = String(values.orunWorkspace || "").trim() || "ws_SET_ME";
              const before = fs.readFileSync("intent.yaml", "utf8");
              // Look for the line rather than for a change: a site built into
              // a workspace already named there rewrites the line to the value
              // it already has, and "unchanged" is not "missing".
              const line = /^(\s*workspace:\s*).*$/m;
              if (!line.test(before)) {
                console.error("orun-workspace: no `workspace:` line in intent.yaml — refusing to guess");
                process.exit(1);
              }
              fs.writeFileSync("intent.yaml", before.replace(line, "$1" + ws));
              console.log(
                ws === "ws_SET_ME"
                  ? "orun-workspace: wrote placeholder ws_SET_ME — set your Orun Cloud workspace before enabling remote state"
                  : "orun-workspace: intent.yaml workspace -> " + ws,
              );
        # The site carries no work tree of this repository's: `specs/` and
        # `tasks/` never ship, so intent.yaml's `work:` block would point its
        # every plan at two directories that do not exist.
        - id: work-tree
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/work-tree.mjs", "--strip"]
        # STAGE AND PROD DEPLOY SIDE BY SIDE UNTIL THE BOOTSTRAP IS DONE. The
        # promotion gate makes prod wait out stage's deploy; during a
        # bootstrap both are empty and the landing is watched to green, so it
        # protects nothing and doubles the convergence. Deferred here,
        # restored by 02-docs. tooling/bootstrap/promotion.mjs.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--defer"]
        # DEV'S VERIFY LANES STAY OFF MAIN UNTIL THE BOOTSTRAP IS DONE, by the
        # same mechanism: a third Next.js build on the merge proves nothing
        # the baseline's own CI did not. Pull requests keep their dev lanes.
        # tooling/bootstrap/dev-lanes.mjs.
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--defer"]
        # Re-stage so `git ls-files` and `rebrand --verify` see the rewritten tree.
        - id: restage
          run: ["git", "add", "-A"]
        - id: rebrand-verify
          run: ["node", "{{ .baseline.dir }}/tooling/rebrand/rebrand.mjs", "--verify", "--values", ".rebrand/values.json"]
        # The repo has to exist before there is anywhere to land.
        - id: repo
          uses: orun.repo/ensure@v1
          narrate: "The repository exists at {{ .inputs.githuborg }}/{{ .inputs.reponame }}."
          with:
            owner: "{{ .inputs.githuborg }}"
            name: "{{ .inputs.reponame }}"
            private: "{{ .inputs.repoPrivate }}"
        # THE REPOSITORY MUST BE THE WORKSPACE'S before anything lands in it,
        # or the site's own CI cannot reach the platform: every convergence
        # lane authenticates over GitHub OIDC, resolved through the repo link.
        # `link` may be refused where the credential cannot write links (a
        # workspace key) and the platform has linked the repository already,
        # so it is best effort and `check` is the gate — an unlinked
        # repository stops here, naming the fix, instead of in every lane.
        - id: link
          run:
            - bash
            - -c
            - |
              orun cloud link --org "$1" || true
              orun cloud check --org "$1" || {
                echo "$2 is not linked to workspace $1 — its CI cannot authenticate. Link it (orun cloud link --org $1, or the console's Git Repos) and re-run this phase." >&2
                exit 1
              }
            - link
            - "{{ .inputs.orunWorkspace }}"
            - "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
        # The deploy credentials, brokered, in ONE hook (orun >= v2.87.0):
        # `secrets` mints each key under its own scope template from the one
        # connection the build is bound to, reading the connections and the
        # existing secrets once and creating the missing keys side by side.
        # This product needs two scopes on purpose, and still gets them: each
        # key keeps its own template. `workers-deploy` (Workers Scripts and KV
        # write) deploys the storefront's Worker; it carries NO R2, so the R2
        # root cannot create or list a bucket with it. `r2-data` (Workers R2
        # Storage Write) is the R2 root's own token, CLOUDFLARE_R2_TOKEN, which
        # its component binds as the provider's CLOUDFLARE_API_TOKEN — the way
        # a D1 root binds a d1-edit token. The account id is a connection fact
        # both bind. Keys that already exist are kept. After the link, before
        # the landing whose convergence uses them.
        - id: secrets
          uses: orun.integrations/reconcile@v1
          with:
            provider: cloudflare
            secrets:
              - { key: CLOUDFLARE_API_TOKEN, template: workers-deploy }
              - { key: CLOUDFLARE_R2_TOKEN, template: r2-data }
              - { key: CLOUDFLARE_ACCOUNT_ID, template: account-id }
        # The task this landing closes, and its key. The run-level list above
        # opens it in the background; this is the first hook that needs it,
        # so it is the one that waits for that list (orun >= v2.88.0) — every
        # hook before it ran while the task plane was still being set up.
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Build the product in one landing"
            prefix: BASE
            contract: .baseline/tasks/01-product.TaskContract.yaml
        # THE PRODUCT IS A PULL REQUEST THAT IS CHECKED, THEN MERGED — checked
        # HERE (`checks: local`, orun >= v2.88.0): `orun validate`, then
        # `orun plan` as the pull request and as the merge to main plan it,
        # on the commit, before it is pushed. That is what the PR's `plan`
        # job checks (the intent, every component and every composition
        # resolve), plus the merge's own plan, in under a second instead of a
        # runner's. A tree that fails is never pushed. The PR's CI still runs
        # (`plan` alone on a bootstrap branch, `orun/BASE-…`, ci.yml); nothing
        # waits for it. The merge runs every lane on main a minute later, for
        # real, and that convergence is what `await` watches.
        - id: land
          uses: orun.pr/land@v1
          narrate: "The product is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "feat: {{ .inputs.productname }}, the whole product from the commerce baseline"
            checks: local
      await:
        - id: converge
          uses: orun.run/watch@v1
          narrate: "The R2 bucket applied, the storefront built with its name, deployed and passed its smoke, and the convergence run came back green."
          with:
            # The run for the commit THIS landing merged — the branch's newest
            # run, read the moment the merge returns, may be another push's.
            # Only ci.yml runs on a push to main, so it is that workflow's run.
            sha: "{{ .phase.hooks.land.outputs.mergeSha }}"
            repo: "{{ .inputs.githuborg }}/{{ .inputs.reponame }}"
            resumeBudget: 3
            waitSeconds: 1800
            # Read every 5 s, not the action's 40: the build goes on the
            # moment the run is green instead of up to 40 s after it.
            pollSeconds: 5
        # NO SEPARATE WIRING CHECK. The R2 root's apply lease-publishes its
        # wiring document to the project's stage and prod rungs, and its one
        # reader resolves it in this convergence from the place every later
        # run looks: the storefront's deploy job, on stage and on prod,
        # resolves WIRING_CLOUDFLARE_R2_STAGE and _PROD (apps/web/component.yaml's
        # secretEnv, waiting on the apply — enforced on main) before its first
        # step, fail-closed. A missing document fails that lane, so a green run
        # already says it is there. WIRING_CLOUDFLARE_R2 was the await's only
        # key, so the await goes with it.
        - id: verify
          uses: orun.http/probe@v1
          narrate: "The storefront answered on stage and prod."
          with:
            urls:
              - "https://{{ .inputs.reponame }}-web-stage.{{ .inputs.subdomain }}.workers.dev"
              - "https://{{ .inputs.reponame }}-web-prod.{{ .inputs.subdomain }}.workers.dev"

  # Places nothing. It records what 01-product built, from PROBED facts rather
  # than from what the blueprint intended — which is why it runs last. Its
  # render probes every URL as it writes the record, and this landing
  # redeploys nothing, so there is no probe after it to wait for.
  - name: 02-docs
    title: The deployment, recorded
    description: The live-deployment manifest, rendered from probed reality, and the promotion gate and dev's lanes put back.
    # An estimate, not a measurement: the render's two probes, the task, and
    # one landing checked here and merged, with nothing after it to wait for.
    expectedMinutes: 1
    narrate:
      start:  "Now recording what was actually built — probing every URL and writing the deployment manifest into the repository."
      done:   "ai/context/deployment.md now records the live deployment, written from probed facts, and prod waits on stage again. {{ .meta.elapsed }}."
      failed: "The deployment record did not land. The site is still live; only the write-up is missing."
    modules: []
    requires:
      phases: [01-product]
    hooks:
      post:
        # THE SITE GOES LIVE WITH ITS PROMOTION GATE. 01-product deferred
        # `prod.promotion.dependsOn: [stage]`; this, the last landing, puts it
        # back, and from here on a change reaches prod only after stage.
        # Restoring touches only intent.yaml's `environments` section, which
        # `orun plan --changed` maps to no component, so this landing
        # redeploys nothing.
        - id: promotion
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/promotion.mjs", "--restore"]
        # And dev verifies every merge to main again (01-product deferred it).
        - id: dev-lanes
          run: ["node", "{{ .baseline.dir }}/tooling/bootstrap/dev-lanes.mjs", "--restore"]
        - id: render
          run: ["bash", "{{ .baseline.dir }}/hooks/render-deployment-docs.sh", ".", "{{ .inputs.orunWorkspace }}", "{{ .baseline.dir }}"]
        - id: task
          uses: orun.task/ensure@v1
          with:
            kind: task
            epic: "{{ .inputs.epicSlug }}"
            milestone: "{{ .phase.name }}"
            name: "Record the live deployment"
            prefix: BASE
            contract: .baseline/tasks/02-docs.TaskContract.yaml
        # Checked here and merged, as 01-product's landing is
        # (`checks: local`).
        - id: land
          uses: orun.pr/land@v1
          narrate: "The deployment record is merged into main."
          with:
            task: "{{ .phase.hooks.task.outputs.key }}"
            epic: "{{ .inputs.epicSlug }}"
            branchSlug: "{{ .phase.name }}"
            title: "docs(deployment): record the live deployment state"
            checks: local
